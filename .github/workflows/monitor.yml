name: 20Min Fever Time Monitor

on:
  schedule:
    # 20分間隔（毎時 0分, 20分, 40分 に自動起動）
    - cron: '*/20 * * * *'
  workflow_dispatch: # 手動で動かすテスト用ボタン

jobs:
  check-fever:
    runs-on: ubuntu-latest
    steps:
      - name: コードの取得
        uses: actions/checkout@v4

      - name: Pythonのセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: キャッシュの復元（前回の状態を引き継ぐ）
        uses: actions/cache@v3
        with:
          path: fever_state.json
          key: fever-state-${{ github.run_id }}
          restore-keys: |
            fever-state-

      - name: ライブラリのインストール
        run: |
          pip install requests beautifulsoup4

      - name: 監視スクリプトの実行
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python main.py
